# Fork-only workflow for https://github.com/ibro45/voxtype (not for upstream).
# Tests the patched branch on Apple Silicon and publishes the macOS binary
# when a `setup-*` tag is pushed. Upstream's own release workflows only react
# to `v*` tags, `rc/*` and main/dev, so they stay quiet here.
name: setup-build

on:
  push:
    branches: ['setup/**']
    tags: ['setup-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib --features parakeet --locked
      - run: cargo build --release --bin voxtype --features parakeet --locked
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/voxtype dist/voxtype
          codesign --force --sign - dist/voxtype
          codesign --verify --verbose dist/voxtype
          otool -L dist/voxtype
          dist/voxtype --version
          git rev-parse HEAD > dist/COMMIT
          tar -C dist -czf voxtype-macos-arm64.tar.gz voxtype COMMIT
          shasum -a 256 voxtype-macos-arm64.tar.gz | tee voxtype-macos-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-macos-arm64
          path: voxtype-macos-arm64.tar.gz*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/setup-')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: voxtype-macos-arm64
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c voxtype-macos-arm64.tar.gz.sha256
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Patched Voxtype for Apple Silicon, built from $GITHUB_SHA. Ad-hoc signed, not notarized." \
            voxtype-macos-arm64.tar.gz voxtype-macos-arm64.tar.gz.sha256
